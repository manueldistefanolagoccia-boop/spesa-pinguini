<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e0527a">
<meta name="mobile-web-app-capable" content="yes">
<title>La spesa dei pinguini</title>
<style>
:root{--bg:#fff3f5;--card:#fff;--tx:#3a2a2f;--mu:#a68b93;--ac:#e0527a;--bd:#f7dde3;--st:#f2a900;--dn:#c9b3b9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1417;--card:#2a1c21;--tx:#f6e8ec;--mu:#b69aa3;--ac:#ff7a9e;--bd:#3d2a31;--st:#ffc83d;--dn:#76606a}}
:root[data-theme="dark"]{--bg:#1d1417;--card:#2a1c21;--tx:#f6e8ec;--mu:#b69aa3;--ac:#ff7a9e;--bd:#3d2a31;--st:#ffc83d;--dn:#76606a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 80px}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:30px;margin:6px 0 2px;text-align:center;color:var(--ac)}
.logo{display:block;margin:0 auto;width:120px;height:auto}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px;text-align:center}
.prog{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:0 6px 4px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ff9fb8,var(--ac));border-radius:8px;transition:width .4s}
#cnt{text-align:center;color:var(--mu);font-size:13px;margin-bottom:14px;min-height:18px}
.add{display:grid;grid-template-columns:1fr 64px;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px;margin-bottom:20px;box-shadow:0 4px 14px rgba(224,82,122,.08)}
.add input,.add select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px;min-width:0}
.add select{grid-column:1/2}
.add button{grid-column:2/3;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:24px}
.add #n{grid-column:1/3}
.cat{margin-bottom:16px}
.cat h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin:0 0 6px 6px}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 10px;margin-bottom:6px}
.item .chk,.item .stb{border:0;background:none;padding:2px;font-size:26px;line-height:1;flex:none;color:var(--ac)}
.item .stb{font-size:22px;color:var(--dn)}
.item.star .stb{color:var(--st)}
.item.star{border-color:var(--st)}
.item.done .chk{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.5)}}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--mu);font-size:12px}
.item.done .nm b{text-decoration:line-through;color:var(--dn)}
.item.done{opacity:.75}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;padding:0}
.q span{min-width:18px;text-align:center;font-weight:600}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:0 2px}
.win{text-align:center;background:var(--card);border:1px dashed var(--ac);border-radius:16px;padding:14px;margin-bottom:16px;color:var(--ac);font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:18px}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.foot button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:9px 14px;font:inherit;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.item{flex-wrap:wrap}
.pr{border:0;background:none;padding:2px 0;color:var(--ac);font:inherit;font-size:12px;text-align:left}
.ed{flex-basis:100%;display:flex;gap:6px;margin-top:4px}
.ed input,.ed select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:0}
.ed input{flex:1}
.ed button{border:0;border-radius:10px;background:var(--ac);color:#fff;padding:0 12px;font:inherit}
.ed button+button{background:var(--bd);color:var(--tx)}
.hint{flex-basis:100%;font-size:12px;color:var(--mu)}
#est{text-align:center;color:var(--ac);font-size:13px;margin:-8px 0 14px}
</style>
</head>
<body>
<main>
<svg class="logo" viewBox="0 0 120 70" role="img" aria-label="Due pinguini innamorati"><defs><g id="p"><g transform="rotate(8 36 42)"><ellipse cx="36" cy="42" rx="16" ry="22" fill="#33364f" stroke="#fff" stroke-opacity=".3"/><ellipse cx="38" cy="50" rx="10" ry="13" fill="#fff"/><circle cx="40" cy="29" r="3" fill="#fff"/><circle cx="41" cy="29" r="1.5" fill="#222"/><polygon points="44,33 53,35 44,38" fill="#ff9f1c"/><circle cx="36" cy="35" r="2.5" fill="#ff9fb8" opacity=".8"/><ellipse cx="30" cy="64" rx="5" ry="2.5" fill="#ff9f1c"/><ellipse cx="43" cy="64" rx="5" ry="2.5" fill="#ff9f1c"/></g></g></defs><use href="#p"/><use href="#p" transform="translate(120 0) scale(-1 1)"/><path d="M60 28C50 21 51 13 56 13C58 13 60 15 60 17C60 15 62 13 64 13C69 13 70 21 60 28Z" fill="#e0527a"/></svg>
<h1>La spesa dei pinguini</h1>
<div class="sub" id="st">Caricamento…</div>
<div class="prog"><div id="bar"></div></div>
<div id="cnt"></div>
<div class="add">
<input id="n" placeholder="Cosa ci serve, amore? 🛍️" autocomplete="off" enterkeyhint="done">
<select id="c"></select>
<button id="b">+</button>
</div>
<div id="l"></div>
<div class="foot"><button id="clr" hidden>Rimuovi i presi</button><button id="all" hidden>Ricomincia da capo</button></div>
</main>
<script>
const CATS=["Proteine","Carboidrati","Grassi e condimenti","Verdura","Frutta","Bevande","Casa e altro"];
const KW={
"Proteine":["latte","yogurt","uova","uovo","formaggio","ricotta","mozzarell","mascarpone","parmigiano","pecorino","grana","affettati","prosciutto","salame","mortadella","speck","bresaola","pollo","manzo","maiale","salsicc","pesce","salmone","tonno","gamber","macinato","carne","tacchino","legumi","fagioli","ceci","lenticchie","tofu","seitan","proteine"],
"Carboidrati":["pane","pasta","riso","farina","patat","cereali","biscott","cornett","merendin","focaccia","grissini","fette","pizza","coca piccola","zucchero","marmellata","miele","cioccolat","torta","gnocchi","couscous","avena","polenta"],
"Grassi e condimenti":["burro","olio","panna","noci","mandorle","nocciole","aceto","sale","pesto","maionese","sugo","passata","pelati","spezie"],
"Verdura":["broccol","cavolfior","carot","pomodor","insalat","zucchin","cipoll","aglio","spinaci","verdura","funghi","peperon","melanzan","finocch","sedano","cavol","lattuga","rucola","zucca","basilico","prezzemolo","cetriol","fagiolini","porri","bietol"],
"Frutta":["banan","aranc","mele","mela","melone","pera","pere","limon","fragol","uva","kiwi","mandarin","clementin","frutta","ananas","pesche","pesca","albicocc","ciliegie","anguria","mirtill","lampon","avocado"],
"Bevande":["acqua","coca","birra","vino","succo","aranciata","tè freddo","bibita","caffè","caffe","limonata"],
"Casa e altro":["carta","detersiv","sapone","shampoo","dentifricio","spazzolino","sacchetti","pellicola","lavatrice","ammorbidente","spugn"]};
function guess(t){t=t.toLowerCase();if(t.includes("coca piccola"))return "Carboidrati";for(const c of ["Bevande","Grassi e condimenti","Verdura","Frutta","Carboidrati","Proteine","Casa e altro"])if(KW[c].some(k=>t.includes(k)))return c;return "Casa e altro"}
const $=id=>document.getElementById(id);
const sel=$("c");sel.innerHTML='<option value="auto">Categoria: automatica</option>'+CATS.map(c=>`<option>${c}</option>`).join("");
let col=null,items=[];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function fmt(ts){if(!ts)return"";const d=new Date(ts),t=new Date(),y=new Date(Date.now()-864e5);
const s=d.toDateString();if(s===t.toDateString())return"oggi";if(s===y.toDateString())return"ieri";
return d.toLocaleDateString("it-IT",{day:"numeric",month:"short"})}
let pcol=null,prices={},edit=null,draft={p:"",u:"€/kg"};
const n2=v=>v.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const pkey=n=>n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";
const defUnit=n=>/latte|acqua|olio|succo|birra|vino|aceto|panna|coca|bibita/i.test(n)?"€/l":/uova|uovo/i.test(n)?"€/pz":"€/kg";
function priceTxt(i){const p=prices[pkey(i.name)];if(!p||!p.entries||!p.entries.length)return"💶 aggiungi prezzo";const e=p.entries,av=e.reduce((a,x)=>a+x.p,0)/e.length;return `💶 Ø ${n2(av)} ${p.unit}`+(e.length>1?` · ultimo ${n2(e[e.length-1].p)}${e[e.length-1].p>av*1.05?" ⚠️":""}`:"")}
function editor(i){return `<div class="ed"><input class="pi" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Prezzo dal cartellino" value="${esc(draft.p)}"><select class="pu">${["€/kg","€/l","€/pz"].map(u=>`<option${u===draft.u?" selected":""}>${u}</option>`).join("")}</select><button data-a="ps">Salva</button><button data-a="pc">×</button></div><div class="hint"></div>`}
const avg=p=>p.entries.reduce((a,x)=>a+x.p,0)/p.entries.length;
function hint(t){const el=t.closest(".item");if(!el)return;const it=items.find(i=>i.id===el.dataset.id),h=el.querySelector(".hint");if(!it||!h)return;const p=prices[pkey(it.name)],v=parseFloat((el.querySelector(".pi").value||"").replace(",",".")),u=el.querySelector(".pu").value;if(!p||!p.entries||!p.entries.length||p.unit!==u||!(v>0)){h.textContent="";return}const a=avg(p),d=Math.round((v/a-1)*100);h.textContent=d>5?`⚠️ ${d}% sopra la tua media (${n2(a)} ${u})`:d<-5?`✅ ${-d}% sotto la tua media (${n2(a)} ${u})`:`👌 In linea con la tua media (${n2(a)} ${u})`}
async function savePrice(it,el){const v=parseFloat((el.querySelector(".pi").value||"").replace(",","."));if(!(v>0)||!pcol)return;const u=el.querySelector(".pu").value;const k=pkey(it.name),old=prices[k];const en=old&&old.unit===u?(old.entries||[]).slice(-9):[];en.push({p:v,t:Date.now()});try{await pcol.doc(k).set({name:it.name,unit:u,entries:en});edit=null;render()}catch(e){$("st").textContent="Prezzo non salvato."}}
$("l").addEventListener("input",e=>{if(e.target.classList.contains("pi")){draft.p=e.target.value;hint(e.target)}if(e.target.classList.contains("pu")){draft.u=e.target.value;hint(e.target)}});
const ICON={"Proteine":"🍳","Carboidrati":"🍝","Grassi e condimenti":"🫒","Verdura":"🥦","Frutta":"🍎","Bevande":"🥤","Casa e altro":"🧺"};
function render(){
const L=$("l"),tot=items.length,done=items.filter(i=>i.done).length,open=tot-done;
$("cnt").textContent=tot?`${done} di ${tot} presi 💗`:"";
$("bar").style.width=tot?(done/tot*100)+"%":"0%";
$("clr").hidden=!done;$("all").hidden=!tot;

if(!tot){L.innerHTML='<div class="empty">La lista è vuota 🌸<br>Aggiungi il primo prodotto qui sopra</div>';return}
const win=!open?'<div class="win">Spesa completata, amore! 🥰</div>':"";
L.innerHTML=win+CATS.map(c=>{const g=items.filter(i=>i.cat===c).sort((a,b)=>(b.star?1:0)-(a.star?1:0));if(!g.length)return"";
return `<div class="cat"><h2>${ICON[c]} ${c}</h2>`+g.map(i=>`<div class="item ${i.done?"done":""} ${i.star?"star":""}" data-id="${i.id}">
<button class="chk" data-a="t" aria-label="Preso">${i.done?"❤️":"🤍"}</button>
<div class="nm"><b>${esc(i.name)}</b><small>${fmt(i.added)}</small><button class="pr" data-a="e">${priceTxt(i)}</button></div>
<button class="stb" data-a="s" aria-label="Importante">${i.star?"★":"☆"}</button>
<button class="x" data-a="d" aria-label="Elimina">×</button>${edit===i.id?editor(i):""}</div>`).join("")+"</div>"}).join("")}
async function add(){
const name=$("n").value.trim();if(!name||!col)return;
const cat=sel.value==="auto"?guess(name):sel.value;
try{await col.add({name,cat,done:false,added:Date.now()})}catch(e){$("st").textContent="Non riesco a salvare: controlla di avere i permessi di modifica."}
$("n").value="";$("n").focus()}
$("b").onclick=add;$("n").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
$("l").addEventListener("click",async e=>{
const b=e.target.closest("button");if(!b||!col)return;
const el=b.closest(".item");const it=items.find(i=>i.id===el.dataset.id);if(!it)return;
const r=col.doc(it.id);const a=b.dataset.a;
try{
if(a==="t"){await r.update({done:!it.done});if(!it.done){edit=it.id;const pr=prices[pkey(it.name)];draft={p:"",u:pr?pr.unit:defUnit(it.name)};render()}}
else if(a==="s")await r.update({star:!it.star});
else if(a==="e"){edit=it.id;const pr=prices[pkey(it.name)];draft={p:"",u:pr?pr.unit:defUnit(it.name)};render()}
else if(a==="pc"){edit=null;render()}
else if(a==="ps")await savePrice(it,el);
else if(a==="d")await r.delete();
}catch(err){$("st").textContent="Modifica non riuscita."}});
let armed=0;$("all").onclick=async()=>{if(!col)return;if(!armed){armed=1;$("all").textContent="Confermi? Tocca ancora";setTimeout(()=>{armed=0;$("all").textContent="Ricomincia da capo"},4000);return}armed=0;$("all").textContent="Ricomincia da capo";for(const i of items){try{await col.doc(i.id).delete()}catch(e){}}};
$("clr").onclick=async()=>{if(!col)return;for(const i of items.filter(i=>i.done)){try{await col.doc(i.id).delete()}catch(e){}}};
function makeDb(){
const watchers=[];const kick=()=>watchers.forEach(w=>w.poll());
const load=n=>{try{return JSON.parse(localStorage.getItem("pinguini:"+n))||{}}catch(e){return{}}};
const save=(n,o)=>{localStorage.setItem("pinguini:"+n,JSON.stringify(o))};
function coll(name,field,dir){return{
async add(d){const o=load(name);const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);o[id]=d;save(name,o);kick();return{id}},
doc(id){return{async set(d){const o=load(name);o[id]=d;save(name,o);kick()},async update(d){const o=load(name);o[id]=Object.assign({},o[id],d);save(name,o);kick()},async delete(){const o=load(name);delete o[id];save(name,o);kick()}}},
orderBy(f,d){return coll(name,f,d)},
onSnapshot(ok,err){const poll=()=>{try{const o=load(name);const docs=Object.keys(o).map(id=>({id,data:()=>o[id]}));if(field)docs.sort((a,b)=>{const x=a.data()[field]||0,y=b.data()[field]||0;return dir==="desc"?y-x:x-y});ok({docs})}catch(e){if(err)err(e)}};watchers.push({poll});poll()}
}}
return{collection:n=>coll(n)}}
(async()=>{
let tm=setTimeout(()=>{$("st").textContent="Sincronizzazione lenta… i dati potrebbero non essere aggiornati."},10000);
let db=null;try{db=makeDb();localStorage.setItem("pinguini:test","1");localStorage.removeItem("pinguini:test")}catch(e){db=null}
if(!db){clearTimeout(tm);$("st").textContent="Il browser non permette di salvare i dati: apri il file con Chrome.";return}
col=db.collection("spesa");pcol=db.collection("prezzi");pcol.onSnapshot(s=>{prices={};s.docs.forEach(d=>{prices[d.id]=d.data()});render()},e=>{});
col.orderBy("added","desc").onSnapshot(s=>{
clearTimeout(tm);
items=s.docs.map(d=>{const o={id:d.id,...d.data()};if(!CATS.includes(o.cat))o.cat=guess(o.name||"");return o});
$("st").textContent="";render()},
e=>{clearTimeout(tm);$("st").textContent="Errore di connessione."});
})();
render();
</script>
</body>
</html>
